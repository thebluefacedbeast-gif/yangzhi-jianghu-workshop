name: Publish Workshop Releases

on:
  workflow_dispatch:
    inputs:
      package:
        description: Release package to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - auto-editor
          - brb-clip-vote
          - kick-video-shoutout
          - kick-brb-highlight-reel
          - audiobook-forge

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Check out release packages
        uses: actions/checkout@v5

      - name: Publish selected release assets
        shell: bash
        run: |
          set -euo pipefail

          publish_release() {
            local key="$1"
            local tag="$2"
            local title="$3"
            local notes="$4"
            local asset="$5"

            if [[ "$PACKAGE" != "all" && "$PACKAGE" != "$key" ]]; then
              return
            fi

            test -s "$asset"

            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$tag" "$asset" --repo "$REPO" --clobber
            else
              gh release create "$tag" "$asset" --repo "$REPO" --title "$title" --notes "$notes"
            fi
          }

          publish_release "auto-editor" "auto-editor-v2.0" "Yangzhi Game Stream Auto-Editor v2.0" "Windows front end for fast game-stream cleanup, chapter splitting, speed adjustment, and upload-ready exports." "release-assets/Yangzhi-Game-Stream-Auto-Editor-v2.0.zip"
          publish_release "brb-clip-vote" "brb-clip-vote-v1.0" "BRB Clip Vote v1.0" "Interactive OBS and Streamer.bot overlay that lets chat vote for the next clip." "release-assets/BRB-Clip-Vote-v1.0.zip"
          publish_release "kick-video-shoutout" "kick-video-shoutout-v1.0" "Kick Video Shoutout v1.0" "Streamer.bot and OBS toolkit for Kick creator clip shoutouts with a profile-card fallback." "release-assets/Kick-Video-Shoutout-v1.0.zip"
          publish_release "kick-brb-highlight-reel" "kick-brb-highlight-reel-v2" "Kick BRB Highlight Reel v2" "OBS and Streamer.bot system for automatically playing Kick highlights during BRB scenes." "release-assets/Kick-BRB-Highlight-Reel-v2.zip"
          publish_release "audiobook-forge" "audiobook-forge-v1.2" "Yangzhi Audiobook Forge v1.2" "Native Windows front end for turning poetry and prose into joined voice-cloned audiobook WAVs through Chatterbox Turbo." "release-assets/Yangzhi-Audiobook-Forge-v1.2.zip"
